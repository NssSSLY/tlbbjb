<div id="tlbb-session" aria-label="单游戏任务面板设计预览" data-session-id="example-session-a">
  <style>
    #tlbb-session{color-scheme:light dark;--sp-bg:light-dark(#f4f5f7,#1b222c);--sp-paper:light-dark(#fff,#242d39);--sp-text:light-dark(#1d2b3b,#e5eaf2);--sp-muted:light-dark(#536172,#b4c0d1);--sp-line:light-dark(#c9d1dd,#4b586b);--sp-active:light-dark(#146e78,#8bd5db);--sp-on:light-dark(#fff,#162f35);--sp-soft:light-dark(#e5f0f2,#2a414a);--sp-error:light-dark(#9d282d,#ffb7be);--sp-gap:10px;background:var(--sp-bg);color:var(--sp-text);font:13px/1.5 'Segoe UI','Microsoft YaHei',sans-serif;border:1px solid var(--sp-line);border-radius:4px;position:relative;overflow-wrap:anywhere}
    #tlbb-session *{box-sizing:border-box}#tlbb-session [hidden]{display:none!important}#tlbb-session button,#tlbb-session input,#tlbb-session select,#tlbb-session textarea{font:inherit;color:inherit;max-width:100%;min-width:0}
    #tlbb-session button{background:var(--sp-paper);border:1px solid var(--sp-line);border-radius:3px;padding:5px 9px}#tlbb-session button:disabled{opacity:.5}#tlbb-session button.sp-primary{background:var(--sp-active);border-color:var(--sp-active);color:var(--sp-on)}
    #tlbb-session input:not([type=checkbox]),#tlbb-session select,#tlbb-session textarea{background:var(--sp-paper);border:1px solid var(--sp-line);padding:5px 7px;border-radius:3px;width:100%}#tlbb-session input[type=checkbox]{width:15px;height:15px;accent-color:var(--sp-active);flex-shrink:0}
    #tlbb-session label.sp-field{display:grid;gap:3px;color:var(--sp-muted)}#tlbb-session label.sp-check{display:flex;align-items:center;gap:5px;color:var(--sp-text)}#tlbb-session fieldset{margin:0;border:1px solid var(--sp-line);border-radius:3px;padding:10px;min-width:0;background:var(--sp-paper)}#tlbb-session legend{font-size:12px;padding:0 5px;color:var(--sp-muted)}
    #tlbb-session .sp-tabs{display:flex;flex-wrap:wrap;background:var(--sp-paper);border-bottom:1px solid var(--sp-line);padding-right:85px}#tlbb-session .sp-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;padding:8px 10px}#tlbb-session .sp-tabs button[aria-selected=true]{background:var(--sp-soft);border-bottom-color:var(--sp-active);color:var(--sp-active);font-weight:600}
    #tlbb-session .sp-content{padding:var(--sp-gap);min-height:315px}#tlbb-session .sp-two{display:grid;grid-template-columns:154px minmax(0,1fr);gap:10px;align-items:start}#tlbb-session .sp-task-list{display:grid;gap:3px}#tlbb-session .sp-task-button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:4px}#tlbb-session .sp-task-button[aria-pressed=true]{background:var(--sp-soft);border-color:var(--sp-active)}#tlbb-session .sp-task-button small{font-size:11px;color:var(--sp-muted)}
    #tlbb-session .sp-stack{display:grid;gap:10px}#tlbb-session .sp-fields{display:grid;grid-template-columns:repeat(var(--sp-cols,3),minmax(0,1fr));gap:9px 10px}#tlbb-session .sp-wide{grid-column:1/-1}#tlbb-session .sp-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}#tlbb-session .sp-between{justify-content:space-between}#tlbb-session .sp-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
    #tlbb-session .sp-minor{color:var(--sp-muted);font-size:12px}#tlbb-session .sp-tag{font-size:11px;background:var(--sp-bg);padding:1px 5px;border-radius:3px;color:var(--sp-muted)}#tlbb-session .sp-tag.sp-ready{background:var(--sp-soft);color:var(--sp-active)}
    #tlbb-session .sp-footer{border-top:1px solid var(--sp-line);padding:8px 10px;background:var(--sp-paper);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}#tlbb-session .sp-status{padding:5px 10px;border-top:1px solid var(--sp-line);font-size:11px;color:var(--sp-muted)}
    #tlbb-session .sp-queue-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:7px;align-items:center;border-bottom:1px solid var(--sp-line);padding:8px;background:var(--sp-paper)}#tlbb-session .sp-queue-row:last-child{border-bottom:0}#tlbb-session .sp-queue-row[aria-current=true]{background:var(--sp-soft)}#tlbb-session .sp-queue-name{border:0;background:transparent;text-align:left;padding:0;font-weight:600}#tlbb-session .sp-queue-actions{display:flex;gap:3px}#tlbb-session .sp-queue-actions button{padding:3px 7px;font-size:12px}
    #tlbb-session .sp-queue-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:10px;align-items:start}#tlbb-session .sp-queue-layout .sp-fields{grid-template-columns:repeat(2,minmax(0,1fr))}#tlbb-session .sp-output{padding:8px;background:var(--sp-bg);font-size:12px;border-radius:3px}#tlbb-session .sp-output:empty{display:none}#tlbb-session .sp-error{color:var(--sp-error)}
    #tlbb-session .sp-rule{display:grid;grid-template-columns:25px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--sp-line)}#tlbb-session .sp-rule:last-child{border-bottom:0}#tlbb-session .sp-subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}#tlbb-session .sp-subtabs button[aria-pressed=true]{background:var(--sp-soft);border-color:var(--sp-active)}
    #tlbb-session details{font-size:12px;color:var(--sp-muted)}#tlbb-session summary{padding:5px 0}#tlbb-session .sp-overlay{position:absolute;inset:0;z-index:4;background:light-dark(#15283b66,#030911bb);padding:42px 15px;border-radius:4px}#tlbb-session .sp-dialog{margin:auto;max-width:560px;background:var(--sp-paper);border:1px solid var(--sp-line);border-radius:5px;padding:14px}#tlbb-session .sp-dialog fieldset{margin:10px 0}#tlbb-session .sp-dialog ul{padding-left:18px;margin:5px 0}#tlbb-session .sp-hidden-view{padding:10px}
    @media(max-width:800px){#tlbb-session .sp-fields{grid-template-columns:repeat(2,minmax(0,1fr))}#tlbb-session .sp-queue-layout{grid-template-columns:minmax(0,1fr)}#tlbb-session .sp-tabs{padding-right:0}#tlbb-session .sp-tabs button{padding:7px 9px}}
    @media(max-width:520px){#tlbb-session .sp-two{grid-template-columns:minmax(0,1fr)}#tlbb-session .sp-task-list{grid-template-columns:repeat(2,minmax(0,1fr))}#tlbb-session .sp-fields,#tlbb-session .sp-queue-layout .sp-fields{grid-template-columns:minmax(0,1fr)}#tlbb-session .sp-tabs button{padding:7px 8px}#tlbb-session .sp-content{min-height:0}#tlbb-session .sp-queue-row{grid-template-columns:20px minmax(0,1fr)}#tlbb-session .sp-queue-actions{grid-column:2}#tlbb-session .sp-rule{grid-template-columns:22px minmax(0,1fr)}#tlbb-session .sp-rule>:last-child{grid-column:2}#tlbb-session .sp-overlay{padding:12px 7px}}
    @media(pointer:coarse){#tlbb-session button{min-height:44px}#tlbb-session input:not([type=checkbox]),#tlbb-session select{font-size:16px;min-height:44px}#tlbb-session label.sp-check{min-height:44px}}
  </style>
  <div id="sp-window">
    <nav id="sp-tabs" class="sp-tabs" role="tablist" aria-label="任务功能"></nav>
    <section id="sp-content" class="sp-content" role="tabpanel"></section>
    <div class="sp-footer"><div class="sp-row"><button type="button" class="sp-primary" data-action="start">开始流程</button><button type="button" data-action="pause" disabled>暂停 / 恢复</button><button type="button" data-action="stop">停止</button></div><div class="sp-row"><button type="button" data-action="copy">复制配置</button><button type="button" data-action="save">保存</button></div></div>
    <div class="sp-status" id="sp-status" role="status" aria-live="polite">角色甲 · 五台山 · 设计预览 / 未连接</div>
  </div>
  <div id="sp-hidden" class="sp-hidden-view" hidden><button type="button" data-action="home">Home 呼出此游戏面板（演示）</button></div>
  <div id="sp-modal" hidden></div>
  <script id="sp-task-data" type="application/json">

    {"id":"supply","name":"补给 / 背包维护","group":"supply","family":"maintenance"},

  <script>
  (()=>{
    const root=document.getElementById('tlbb-session'),tasks=JSON.parse(root.querySelector('#sp-task-data').textContent),byId=id=>tasks.find(t=>t.id===id),clone=v=>JSON.parse(JSON.stringify(v)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tabs=[['dungeon','副本'],['daily','日常'],['activity','活动'],['life','生活'],['grind','挂机'],['battle','技能'],['bag','拾取背包'],['supply','补给恢复'],['queue','任务流程'],['settings','设置']];
    const initial={dungeon:'yanzi',daily:'shimen',activity:'chess',life:'plant',grind:'grind'};
    function defaults(t){return {rounds:1,timeout:120,retry:2,failure:'停止队列',...(t.family==='move'||t.family==='plant'?{map:'洛阳',x:360,y:317}:{}),...(t.family==='move'?{tolerance:0.3}:{}),...(t.family==='plant'?{crop:'小麦',growth:'早产',occupancy:'等待空地',harvest:'播种并收获',wait_seconds:20}:{}),...(t.family==='gather'?{map:'待选择',resource:'待选择',route:'待配置',end:'目标数量',quantity:20,minutes:30,empty:'更换采集点'}:{}),...(t.family==='dungeon'?{difficulty:'普通',method:'完整通关',team:'已有队伍',role:'队员'}:{}),...(t.family==='daily'?{branch:'全部已适配分支',material:'优先使用背包',budget:0}:{}),...(t.family==='cargo'?{route:'待核对本服路线',budget:0}:{}),...(t.family==='timed'?{window:'待核对游戏日历',late:'跳过本次',team:'已有队伍'}:{}),...(t.family==='grind'?{map:'待选择',target:'待配置',radius:20,minutes:30}:{}),...(t.family==='treasure'?{map_type:'待识别物品',branch:'未知分支等待人工'}:{}),...(t.family==='wait'?{time:'20:00'}:{})};}
    const configs=Object.fromEntries(tasks.map(t=>[t.id,defaults(t)]));let sequence=10;
    const makeNode=id=>({id:'node-'+sequence++,task:id,enabled:true,params:clone(configs[id])});
    const state={tab:'life',selected:{...initial},queue:[makeNode('luoyang_move'),makeNode('plant')],node:null,bagTab:'pickup',revision:0,bound:true,visible:true,bag:{pickup:true,pickMode:'仅白名单',destroy:false,whitelist:'破旧材料',keepList:'',otherAction:'保留',preview:false},battle:{heal:60,target:'任务目标优先',pet:'跟随任务策略'},supply:{enabled:false,slots:5,budget:0,missing:'停止并等待',stuck:'有限重试后停止',death:'停止并等待',disconnect:'等待人工'},message:'设计预览 / 未连接'};
    state.node=state.queue[0].id;
    const targets=[{id:'role-b',name:'角色乙',school:'逍遥',queue:[makeNode('fish')],battle:{heal:60,target:'任务目标优先'},bag:clone(state.bag),supply:clone(state.supply)},{id:'role-c',name:'角色丙',school:'昆仑',queue:[],battle:{heal:60,target:'任务目标优先'},bag:clone(state.bag),supply:clone(state.supply)}];
    let modal=null,lastSavedTab='';const design={density:'compact',columns:3};
    function restore(s){const next=s?.privateContent?.tab;if(tabs.some(t=>t[0]===next)&&state.tab!==next){state.tab=next;return true;}return false;}
    restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(restore(e.detail?.globals?.widgetState))render();});
    function remember(){if(lastSavedTab===state.tab)return;lastSavedTab=state.tab;try{window.openai?.setWidgetState?.({modelContent:{design:'单游戏独立面板',tab:tabs.find(t=>t[0]===state.tab)[1]},privateContent:{tab:state.tab}})?.catch(()=>{});}catch{}}
    function style(){root.style.setProperty('--sp-gap',design.density==='compact'?'10px':'16px');root.style.setProperty('--sp-cols',String(design.columns));}
    function say(s){state.message=s;root.querySelector('#sp-status').textContent='角色甲 · 五台山 · '+s;}
    function btn(action,text,attrs=''){return `<button type="button" data-action="${action}" ${attrs}>${text}</button>`;}
    function field(label,key,value,type='text',scope='param',limits=''){return `<label class="sp-field">${label}<input type="${type}" aria-label="${label}" data-${scope}="${key}" value="${esc(value)}" ${limits}></label>`;}
    function select(label,key,value,options,scope='param'){return `<label class="sp-field">${label}<select aria-label="${label}" data-${scope}="${key}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;}
    function check(label,key,value,scope){return `<label class="sp-check"><input type="checkbox" data-${scope}="${key}" ${value?'checked':''}>${label}</label>`;}
    function badge(t){return `<span class="sp-tag ${t.id==='luoyang_move'?'sp-ready':''}">${t.id==='luoyang_move'?'0.2 已适配':'待适配'}</span>`;}
    function currentNode(){return state.queue.find(n=>n.id===state.node);}
    function activeTask(){return byId(state.tab==='queue'?(currentNode()?.task||'luoyang_move'):state.tab==='settings'?'luoyang_move':state.selected[state.tab]);}
    function activeParams(){return state.tab==='queue'?currentNode()?.params:configs[activeTask()?.id];}
    function nodeSummary(n){const p=n.params,t=byId(n.task);return t.family==='plant'?`${p.map} ${p.x},${p.y} / ${p.crop} / ${p.rounds} 轮`:t.family==='move'?`${p.map} ${p.x},${p.y}`:t.family==='grind'?`${p.minutes} 分钟`:t.family==='dungeon'?`${p.method} / ${p.rounds} 次`:`${p.rounds} 次`;}
    function taskFields(t,p){let out='';
      if(['move','plant'].includes(t.family))out+=field('地图','map',p.map)+field('目标 X','x',p.x,'number','param','min="0" max="10000" step="0.1"')+field('目标 Y','y',p.y,'number','param','min="0" max="10000" step="0.1"');
      if(t.family==='move')out+=field('到达容差','tolerance',p.tolerance,'number','param','min="0.1" max="2" step="0.1"');
      if(t.family==='plant')out+=field('作物','crop',p.crop)+select('生长类型','growth',p.growth,['早产','晚产'])+field('轮数','rounds',p.rounds,'number','param','min="1" max="999"')+select('地块占用','occupancy',p.occupancy,['等待空地','更换备用地','停止任务'])+select('执行阶段','harvest',p.harvest,['播种并收获','仅播种','仅收获'])+field('空地复查间隔 / 秒','wait_seconds',p.wait_seconds,'number','param','min="2" max="300"');
      if(t.family==='gather')out+=field('地图','map',p.map)+field(t.id==='fish'?'鱼群 / 资源':'资源种类','resource',p.resource)+field('地点 / 路线','route',p.route)+select('结束条件','end',p.end,['目标数量','持续时间'])+field('目标数量','quantity',p.quantity,'number','param','min="1"')+field('持续分钟','minutes',p.minutes,'number','param','min="1"')+select('资源耗尽','empty',p.empty,['更换采集点','等待刷新','停止任务']);
      if(t.family==='dungeon')out+=select('难度','difficulty',p.difficulty,['普通','困难','任务默认'])+select('执行方式','method',p.method,['完整通关','游戏内扫荡'])+field('次数','rounds',p.rounds,'number','param','min="1" max="99"')+select('队伍','team',p.team,['已有队伍','等待指定队伍'])+select('队伍职责','role',p.role,['队员','队长']);
      if(t.family==='daily')out+=field('轮次','rounds',p.rounds,'number','param','min="1" max="999"')+select('任务分支','branch',p.branch,['全部已适配分支','仅指定分支'])+select('物资来源','material',p.material,['优先使用背包','允许购买','缺物品暂停'])+field('购买上限','budget',p.budget,'number','param','min="0"');
      if(t.family==='cargo')out+=field('运输路线','route',p.route)+field('趟数','rounds',p.rounds,'number','param','min="1"')+field('金额上限','budget',p.budget,'number','param','min="0"');
      if(t.family==='timed')out+=field('允许时段','window',p.window)+field('场次','rounds',p.rounds,'number','param','min="1"')+select('错过时段','late',p.late,['跳过本次','等待下一窗口'])+select('队伍','team',p.team,['已有队伍','等待指定队伍']);
      if(t.family==='grind')out+=field('地图','map',p.map)+field('目标 / 路线','target',p.target)+field('活动范围','radius',p.radius,'number','param','min="1" max="100"')+field('持续分钟','minutes',p.minutes,'number','param','min="1" max="1440"');
      if(t.family==='treasure')out+=field('图种 / 物品','map_type',p.map_type)+field('数量','rounds',p.rounds,'number','param','min="1"')+select('未知结果分支','branch',p.branch,['未知分支等待人工','未知分支停止任务']);
      if(t.family==='wait')out+=field('等待至','time',p.time,'time');
      if(t.family==='manual')out+='<span class="sp-minor">到此节点等待人工继续</span>';
      if(t.family==='maintenance')out+='<span class="sp-minor">使用“补给恢复”中的角色默认规则</span>';
      return out;
    }
    function editor(t,p,queued=false){return `<div class="sp-stack sp-task-editor"><fieldset><legend>${esc(t.name)} ${badge(t)}</legend><div class="sp-fields">${taskFields(t,p)}</div></fieldset><fieldset><legend>执行限制</legend><div class="sp-fields">${field('超时 / 秒','timeout',p.timeout,'number','param','min="10" max="86400"')}${field('重试上限','retry',p.retry,'number','param','min="0" max="5"')}${select('失败处理','failure',p.failure,['停止队列','跳过本项','等待人工'])}</div></fieldset>${queued?'':`<div class="sp-toolbar">${btn('add-task','加入任务流程','class="sp-primary"')}${btn('check-task','运行本项')}</div>`}</div>`;}
    function taskPage(){const t=activeTask();return `<div class="sp-two"><div class="sp-task-list" aria-label="本页任务">${tasks.filter(x=>x.group===state.tab).map(x=>`<button type="button" class="sp-task-button" data-action="task" data-id="${x.id}" aria-pressed="${x.id===t.id}"><span>${esc(x.name)}</span><small>待适配</small></button>`).join('')}</div>${editor(t,configs[t.id])}</div>`;}
    function queuePage(){const n=currentNode();return `<div class="sp-queue-layout"><div class="sp-stack"><div>${state.queue.map((n,i)=>`<div class="sp-queue-row" aria-current="${n.id===state.node}"><input type="checkbox" data-node="${n.id}" aria-label="启用 ${esc(byId(n.task).name)}" ${n.enabled?'checked':''}><div><button type="button" class="sp-queue-name" data-action="select-node" data-id="${n.id}">${i+1}. ${esc(byId(n.task).name)}</button><div class="sp-minor sp-node-summary">${esc(nodeSummary(n))}</div></div><div class="sp-queue-actions">${btn('up','上移',`data-id="${n.id}" ${i===0?'disabled':''}`)}${btn('down','下移',`data-id="${n.id}" ${i===state.queue.length-1?'disabled':''}`)}${btn('remove','删除',`data-id="${n.id}"`)}</div></div>`).join('')||'<span class="sp-minor">任务流程为空</span>'}</div><div class="sp-row">${btn('add-wait','添加等待')}${btn('add-manual','人工节点')}${btn('check-queue','检查流程')}</div><details><summary>时间安排</summary><div class="sp-fields">${field('开始时间','start_time',state.start_time||'08:00','time','schedule')}${field('结束时间','end_time',state.end_time||'23:00','time','schedule')}</div></details></div><div>${n?editor(byId(n.task),n.params,true):''}</div></div>`;}
    function battlePage(){return `<div class="sp-stack"><fieldset><legend>峨嵋 · 技能规则</legend><div class="sp-rule"><span>1</span><label class="sp-field">恢复技能<input aria-label="恢复技能" value="待读取角色技能" disabled></label>${field('血量低于 %','heal',state.battle.heal,'number','battle','min="1" max="100"')}</div><div class="sp-rule"><span>2</span><label class="sp-field">增益 / 控制<input value="待映射" disabled aria-label="增益技能"></label><span class="sp-minor">冷却就绪且目标有效</span></div><div class="sp-rule"><span>3</span><label class="sp-field">输出循环<input value="待映射" disabled aria-label="输出技能"></label>${select('目标选择','target',state.battle.target,['任务目标优先','仅范围内怪物','跟随队伍目标'],'battle')}</div></fieldset><fieldset><legend>珍兽 / 形态</legend><div class="sp-fields">${select('珍兽策略','pet',state.battle.pet,['跟随任务策略','仅防御'],'battle')}<label class="sp-field">形态策略<input value="当前门派无已适配形态" disabled aria-label="形态策略"></label></div></fieldset></div>`;}
    function previewItems(){const white=state.bag.whitelist.split(/[,，;；\n]/).map(s=>s.trim()),keep=state.bag.keepList.split(/[,，;；\n]/).map(s=>s.trim());return [['破旧材料',2,false],['任务信件',1,true],['未知物品',1,true]].map(([n,c,p])=>`${esc(n)} × ${c}：${p||keep.includes(n)?'保护 / 保留':white.includes(n)?'匹配白名单（示例）':'保留'}`).join('<br>');}
    function bagPage(){return `<div class="sp-subtabs">${[['pickup','拾取'],['destroy','销毁'],['keep','保留 / 存仓']].map(([id,name])=>`<button type="button" data-action="bag-tab" data-id="${id}" aria-pressed="${state.bagTab===id}">${name}</button>`).join('')}</div>${state.bagTab==='pickup'?`<fieldset><legend>拾取包裹</legend><div class="sp-stack">${check('启用拾取','pickup',state.bag.pickup,'bag')}${select('拾取方式','pickMode',state.bag.pickMode,['仅白名单','任务物品优先'],'bag')}</div></fieldset>`:state.bagTab==='destroy'?`<fieldset><legend>销毁规则</legend><div class="sp-stack">${field('物品白名单（示例名称）','whitelist',state.bag.whitelist,'text','bag')}<div class="sp-row">${btn('preview-destroy','预览匹配')}${check('启用销毁','destroy',state.bag.destroy,'bag')}</div><div class="sp-output" id="sp-destroy-output">${state.bag.preview?previewItems():''}</div><div class="sp-minor">保护：任务 / 锁定 / 装备 / 保留 / 未知属性</div></div></fieldset>`:`<fieldset><legend>物品处理</legend><div class="sp-fields">${field('保留名单','keepList',state.bag.keepList,'text','bag')}${select('其他物品','otherAction',state.bag.otherAction,['保留','按规则存仓','按规则出售'],'bag')}</div></fieldset>`}`;}
    function supplyPage(){return `<div class="sp-stack"><fieldset><legend>补给</legend><div class="sp-stack">${check('启用维护插入','enabled',state.supply.enabled,'supply')}<div class="sp-fields">${field('最少空位','slots',state.supply.slots,'number','supply','min="1" max="100"')}${field('购买 / 修理预算','budget',state.supply.budget,'number','supply','min="0"')}${select('缺药处理','missing',state.supply.missing,['停止并等待','按预算购买'],'supply')}</div></div></fieldset><fieldset><legend>异常恢复</legend><div class="sp-fields">${select('卡路','stuck',state.supply.stuck,['有限重试后停止','等待人工'],'supply')}${select('死亡','death',state.supply.death,['停止并等待','按复活规则恢复'],'supply')}${select('掉线','disconnect',state.supply.disconnect,['等待人工','按账号配置重登'],'supply')}</div></fieldset></div>`;}
    function settingsPage(){return `<div class="sp-stack"><fieldset><legend>Lua</legend><div class="sp-row sp-between"><span>luoyang_plant.lua <span class="sp-tag">0.2 / 现有脚本</span></span>${btn('reload-lua','重新加载')}${btn('refresh-lua','刷新脚本列表')}</div></fieldset><fieldset><legend>当前绑定</legend><div class="sp-fields"><label class="sp-field">角色<input value="角色甲（示例）" disabled aria-label="绑定角色"></label><label class="sp-field">服务器<input value="五台山（示例）" disabled aria-label="绑定服务器"></label><label class="sp-field">会话<input value="example-session-a" disabled aria-label="绑定会话"></label></div><div class="sp-toolbar">${btn('hide','隐藏面板')}${btn('detach','解绑此游戏')}</div></fieldset><details><summary>移动测试 / 诊断</summary><div style="padding-top:8px">${editor(byId('luoyang_move'),configs.luoyang_move)}</div></details></div>`;}
    function render(){root.querySelector('#sp-window').hidden=!state.visible;root.querySelector('#sp-hidden').hidden=state.visible;root.querySelector('#sp-tabs').innerHTML=tabs.map(([id,name])=>`<button type="button" role="tab" id="sp-tab-${id}" aria-controls="sp-content" aria-selected="${state.tab===id}" data-action="tab" data-id="${id}">${name}</button>`).join('');const content=root.querySelector('#sp-content');content.setAttribute('aria-labelledby','sp-tab-'+state.tab);content.innerHTML=initial[state.tab]?taskPage():({queue:queuePage,battle:battlePage,bag:bagPage,supply:supplyPage,settings:settingsPage}[state.tab])();say(state.message);renderModal();style();}
    function validate(nodes){const errors=[];if(!nodes.length)errors.push('没有启用的任务');for(const n of nodes){const t=byId(n.task),p=n.params;if(t.id!=='luoyang_move')errors.push(t.name+'：待适配');else if(p.map!=='洛阳'||![p.x,p.y,p.tolerance].every(v=>v!==''&&Number.isFinite(Number(v)))||p.x<0||p.y<0||p.x>10000||p.y>10000||p.tolerance<0.1||p.tolerance>2)errors.push('移动参数无效');}say(errors.length?errors.join('；'):'参数检查通过；设计预览未连接，不发送动作');}
    function copyDiff(){const out=[];for(const id of modal.targets){const t=targets.find(x=>x.id===id);out.push(t.name+'：保留登录身份');for(const scope of modal.scopes){if(scope==='battle'){out.push(t.name+'：门派不同，跳过技能');continue;}if(modal.mode==='fill'&&(scope!=='queue'||t.queue.length)){out.push(t.name+'：已有内容，保持原值');continue;}if(scope==='queue'){const before=t.queue[0]?.params,after=state.queue[0]?.params;out.push(t.name+`：任务 ${t.queue.length} → ${state.queue.length}`);if(before?.x!==undefined&&after?.x!==undefined)out.push(`首项坐标 ${before.x},${before.y} → ${after.x},${after.y}`);}if(scope==='bag')out.push(t.name+`：原销毁${t.bag.destroy?'开启':'关闭'} → 关闭，需重新预览`);if(scope==='supply')out.push(t.name+'：补给规则生成副本');}}return out;}
    function renderModal(){const host=root.querySelector('#sp-modal'),wasOpen=!host.hidden,focused=document.activeElement;let selector=null;for(const key of ['data-copy-target','data-copy-scope','data-copy-mode','data-action'])if(host.contains(focused)&&focused.hasAttribute(key)){selector=`[${key}="${focused.getAttribute(key)}"]`;break;}root.querySelector('#sp-window').inert=!!modal;if(!modal){host.hidden=true;host.innerHTML='';if(wasOpen&&state.visible)root.querySelector('[data-action="copy"]').focus({preventScroll:true});return;}host.hidden=false;host.innerHTML=`<div class="sp-overlay"><section class="sp-dialog" role="dialog" aria-modal="true" aria-labelledby="sp-copy-title"><div class="sp-row sp-between"><strong id="sp-copy-title">复制当前角色配置</strong>${btn('close-copy','关闭')}</div><fieldset><legend>目标角色</legend><div class="sp-row">${targets.map(t=>`<label class="sp-check"><input type="checkbox" data-copy-target="${t.id}" ${modal.targets.includes(t.id)?'checked':''}>${t.name} · ${t.school}</label>`).join('')}</div></fieldset><fieldset><legend>范围</legend><div class="sp-row">${[['queue','流程 / 参数'],['battle','技能'],['bag','拾取 / 背包'],['supply','补给']].map(([id,n])=>`<label class="sp-check"><input type="checkbox" data-copy-scope="${id}" ${modal.scopes.includes(id)?'checked':''}>${n}</label>`).join('')}</div></fieldset><label class="sp-field">写入方式<select data-copy-mode aria-label="写入方式"><option value="replace" ${modal.mode==='replace'?'selected':''}>覆盖所选范围</option><option value="fill" ${modal.mode==='fill'?'selected':''}>只填空缺</option></select></label><div class="sp-output" style="margin-top:10px">${modal.preview?'<ul>'+copyDiff().map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':''}</div><div class="sp-toolbar">${btn('copy-preview','预览差异')}${btn('copy-apply','复制到草稿',`class="sp-primary" ${!modal.preview||!modal.targets.length||!modal.scopes.length?'disabled':''}`)}</div></section></div>`;const next=selector&&host.querySelector(selector);(next&&!next.disabled?next:host.querySelector('button')).focus({preventScroll:true});}
    function home(){state.bound=true;state.visible=true;state.message='设计预览 / 未连接';render();}
    function detach(){state.bound=false;state.visible=false;state.message='已解绑此游戏（示例）';render();root.querySelector('#sp-hidden button').focus({preventScroll:true});}
    root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
      if(a==='tab')state.tab=id;if(a==='task')state.selected[state.tab]=id;if(a==='select-node')state.node=id;
      if(a==='add-task'){const n=makeNode(activeTask().id);state.queue.push(n);state.node=n.id;say('已加入当前游戏任务流程');}
      if(a==='check-task')validate([{task:activeTask().id,params:activeParams()}]);if(a==='start'||a==='check-queue')validate(state.queue.filter(n=>n.enabled));
      if(a==='save'){state.revision++;say('当前角色配置 v'+state.revision+' 已保存在本次预览');}
      if(a==='stop')say('已请求停止此游戏任务（示例）');
      if(a==='remove'){state.queue=state.queue.filter(n=>n.id!==id);if(state.node===id)state.node=state.queue[0]?.id;}
      if(a==='up'||a==='down'){const i=state.queue.findIndex(n=>n.id===id),j=i+(a==='up'?-1:1);if(i>=0&&j>=0&&j<state.queue.length)[state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]];}
      if(a==='add-wait'||a==='add-manual'){const n=makeNode(a==='add-wait'?'wait':'manual');state.queue.push(n);state.node=n.id;}
      if(a==='bag-tab')state.bagTab=id;
      if(a==='preview-destroy'){state.bag.preview=!!state.bag.whitelist.trim();say(state.bag.preview?'已预览示例匹配':'白名单为空');}
      if(a==='copy')modal={targets:[],scopes:['queue'],mode:'replace',preview:false};if(a==='close-copy')modal=null;if(a==='copy-preview')modal.preview=true;
      if(a==='copy-apply'&&modal?.preview){const names=[];for(const id of modal.targets){const t=targets.find(t=>t.id===id);names.push(t.name);for(const scope of modal.scopes){if(scope==='battle')continue;if(modal.mode==='fill'&&(scope!=='queue'||t.queue.length))continue;t[scope]=clone(state[scope]);if(scope==='queue')t.queue.forEach(n=>n.id='node-'+sequence++);if(scope==='bag'){t.bag.destroy=false;t.bag.preview=false;}}}modal=null;say('已生成独立草稿：'+names.join('、')+'；账号身份保留');}
      if(a==='reload-lua')say('设计预览未连接，未重载游戏脚本');if(a==='refresh-lua')say('当前发布记录：luoyang_plant.lua；其他任务待适配');
      if(a==='hide'){state.visible=false;render();root.querySelector('#sp-hidden button').focus({preventScroll:true});return;}if(a==='detach'){detach();return;}if(a==='home'){home();return;}
      render();remember();
    });
    function updateField(el){for(const scope of ['param','battle','bag','supply','schedule']){const key=el.dataset[scope];if(!key)continue;const object=scope==='param'?activeParams():scope==='schedule'?state:state[scope];if(!object)return;if(scope==='bag'&&key==='destroy'&&el.checked&&!object.preview){el.checked=false;say('先预览当前规则');return;}object[key]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':Number(el.value)):el.value;if(scope==='bag'&&['whitelist','keepList'].includes(key)){object.preview=false;object.destroy=false;const cb=root.querySelector('[data-bag="destroy"]');if(cb)cb.checked=false;root.querySelector('#sp-destroy-output')?.replaceChildren();say('规则已改，销毁关闭');}if(scope==='param'&&state.tab==='queue'){const selectedRow=root.querySelector('.sp-queue-row[aria-current=true] .sp-node-summary');if(selectedRow)selectedRow.textContent=nodeSummary(currentNode());}}}
    root.addEventListener('input',e=>{if(e.target.type!=='checkbox'&&e.target.tagName!=='SELECT')updateField(e.target);});
    root.addEventListener('keydown',e=>{if(e.target.matches('input:not([type=checkbox]),textarea,select')&&['Home','End','Insert'].includes(e.key))e.stopImmediatePropagation();},true);
    root.addEventListener('change',e=>{const el=e.target;if(el.dataset.node){const n=state.queue.find(n=>n.id===el.dataset.node);if(n)n.enabled=el.checked;}if(el.type==='checkbox'||el.tagName==='SELECT')updateField(el);if(modal){if(el.dataset.copyTarget){modal.targets=el.checked?[...modal.targets,el.dataset.copyTarget]:modal.targets.filter(id=>id!==el.dataset.copyTarget);modal.preview=false;}if(el.dataset.copyScope){modal.scopes=el.checked?[...modal.scopes,el.dataset.copyScope]:modal.scopes.filter(id=>id!==el.dataset.copyScope);modal.preview=false;}if(el.matches('[data-copy-mode]')){modal.mode=el.value;modal.preview=false;}renderModal();}});
    root.addEventListener('keydown',e=>{if(modal&&e.key==='Escape'){modal=null;renderModal();return;}if(modal&&e.key==='Tab'){const nodes=[...root.querySelectorAll('.sp-dialog button:not(:disabled),.sp-dialog input,.sp-dialog select')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}return;}if(modal)return;if(e.key==='Home'){e.preventDefault();home();}if(e.key==='End'){e.preventDefault();detach();}if(e.key==='Insert'){e.preventDefault();state.visible=!state.visible;render();}if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const i=tabs.findIndex(t=>t[0]===state.tab);state.tab=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length][0];render();root.querySelector('#sp-tab-'+state.tab).focus();remember();}});
    render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:style});tweak.addSelect(design,'density',{label:'面板密度',options:[{label:'紧凑',value:'compact'},{label:'舒展',value:'comfortable'}]});tweak.addSlider(design,'columns',{label:'参数列数',min:2,max:3,step:1});}
  })();
  </script>
</div>
